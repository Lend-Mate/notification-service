  swagger-ui:
    path: /swagger-ui.html
server:
  forward-headers-strategy: framework
  port: 8083

spring:
  application:
    name: notification-service
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: smtp.gmail.com
    port: 587
    username: lendmate.pro@gmail.com
    password: hffhwylvlhvuxhtv
    properties:
      mail:
        smtp:
