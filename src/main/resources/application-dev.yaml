spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_service_db_dev
    username: lendmate
    password: lendmate
  jpa:
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.lendmate.notification_service.kafka.OrderEvent

user-service:
  url: http://localhost:8081

product-service:
  url: http://localhost:8080

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4318
  resource:
    attributes:
      service.name: ${spring.application.name}
  logs:
    exporter: otlp
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  java:
    disabled:
      resource:
        providers: io.opentelemetry.instrumentation.resources.ProcessResourceProvider
